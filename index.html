<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turtle Soccer — Inicio</title>

    <link rel="icon" type="image/jpeg" href="web/web.jpg">

    <style>
        /* CARGA DE FUENTE */
        @font-face {
            font-family: 'TurtleFont';
            src: url('assets/ttf/font.ttf');
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000d1a; font-family: 'TurtleFont', sans-serif, Arial; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; transition: opacity 1s ease; }

        #menu-ui {
            position: absolute;
            bottom: 10%; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 100%;
            transition: opacity 0.5s ease;
        }

        h1 {
            color: #ff4d4d; 
            font-size: clamp(30px, 8vw, 60px);
            text-transform: uppercase;
            margin: 0;
            text-shadow: 2px 2px 0px #000;
        }

        .btn {
            display: inline-block;
            margin: 10px;
            padding: 15px 40px;
            background: #2e7d32; 
            color: white;
            text-decoration: none;
            font-size: 20px;
            border-radius: 50px;
            border: 3px solid #1b5e20;
            transition: 0.3s;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:hover { background: #388e3c; transform: scale(1.1); }

        .btn-store {
            background: #1565c0;
            border-color: #0d47a1;
        }
        .btn-store:hover { background: #1976d2; }

        /* ESTILO DEL BOTÓN ISLA TORTUGA */
        .btn-isla {
            background: #ff9800;
            border-color: #e65100;
            color: #fff;
        }
        .btn-isla:hover {
            background: #ffa726;
            box-shadow: 0 0 15px #ff9800;
        }

        .falcons-tag {
            margin-top: 15px;
            color: #ffd700;
            font-size: 14px;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px #000;
        }

        /* --- ANIMACIÓN DEL AVIÓN --- */
        #transition-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            display: none; /* Oculto por defecto */
        }

        /* El avión */
        #plane-icon {
            position: absolute;
            top: 40%;
            left: -300px; /* Empieza fuera a la izquierda */
            font-size: 150px; /* Tamaño gigante */
            filter: drop-shadow(10px 10px 4px rgba(0,0,0,0.5));
        }

        /* La animación de vuelo */
        .fly-animation {
            animation: flyAcross 1.5s ease-in forwards;
        }

        @keyframes flyAcross {
            0% { left: -300px; transform: rotate(0deg); }
            20% { transform: rotate(5deg); }
            40% { transform: rotate(-2deg); }
            100% { left: 120%; transform: rotate(10deg); }
        }

        /* Flash blanco para cambiar de página */
        #white-fade {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 9998;
            transition: opacity 0.5s ease;
        }

    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="white-fade"></div>

    <div id="transition-layer">
        <div id="plane-icon">✈️</div>
    </div>

    <div id="menu-ui">
        <h1>TURTLE SOCCER 🏆</h1>
        
        <a href="juego.html" class="btn">¡JUGAR AHORA!</a>
        
        <a href="#" id="btn-tortuga" class="btn btn-isla">🏝️ ISLA TORTUGA</a>
        
        <a href="tienda.html" class="btn btn-store">TIENDA</a>

        <div class="falcons-tag">FC FALCONS — EL ESTADIO</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- LÓGICA DE LA TRANSICIÓN DE AVIÓN ---
        const btnTortuga = document.getElementById('btn-tortuga');
        const transitionLayer = document.getElementById('transition-layer');
        const plane = document.getElementById('plane-icon');
        const whiteFade = document.getElementById('white-fade');
        const ui = document.getElementById('menu-ui');

        btnTortuga.addEventListener('click', (e) => {
            e.preventDefault(); // Evita ir al link inmediatamente
            
            // 1. Mostrar capa del avión
            transitionLayer.style.display = 'block';
            
            // 2. Ejecutar animación del avión
            plane.classList.add('fly-animation');

            // 3. Ocultar interfaz suavemente
            ui.style.opacity = '0';

            // 4. Fade to white justo cuando pasa el avión (a los 0.8 segundos)
            setTimeout(() => {
                whiteFade.style.opacity = '1';
            }, 800);

            // 5. Cambiar de página cuando termina la animación
            setTimeout(() => {
                window.location.href = 'isla.html';
            }, 1400);
        });

        // --- CÓDIGO THREE.JS ORIGINAL ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a192f);
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const spot = new THREE.SpotLight(0xffffff, 2);
        spot.position.set(0, 15, 5);
        spot.angle = Math.PI / 6;
        spot.penumbra = 0.5;
        spot.castShadow = true;
        scene.add(spot);
        const texLoader = new THREE.TextureLoader();
        const turtleTex = texLoader.load('assets/tortuga/camaparzon.jpeg'); // Asegúrate que la ruta sea correcta
        const turtleGroup = new THREE.Group();
        const shell = new THREE.Mesh(
            new THREE.SphereGeometry(2.5, 32, 20, 0, Math.PI * 2, 0, Math.PI / 2),
            new THREE.MeshStandardMaterial({ map: turtleTex, color: 0x88cc88 }) 
        );
        shell.scale.y = 0.7;
        const head = new THREE.Mesh(
            new THREE.SphereGeometry(1.2, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0x2d6a4f })
        );
        head.position.set(0, 0.6, 2.5);
        const eyeGeo = new THREE.SphereGeometry(0.35, 32, 32);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
        eyeL.position.set(0.6, 0.4, 0.8);
        const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
        eyeR.position.set(-0.6, 0.4, 0.8);
        head.add(eyeL, eyeR);
        turtleGroup.add(shell, head);
        scene.add(turtleGroup);
        const standTex = texLoader.load('assets/world/gradas.jpg');
        function createStand(x, rot) {
            const stand = new THREE.Mesh(
                new THREE.BoxGeometry(15, 12, 1),
                new THREE.MeshStandardMaterial({ map: standTex })
            );
            stand.position.set(x, 2, -5);
            stand.rotation.y = rot;
            scene.add(stand);
        }
        createStand(-12, Math.PI / 6);
        createStand(12, -Math.PI / 6);
        camera.position.set(0, 4, 12);
        camera.lookAt(0, 1, 0);
        function animate() {
            requestAnimationFrame(animate);
            turtleGroup.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
